name: Publish Windows release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/release.yml]

permissions:
  contents: read

concurrency:
  group: planify-windows-release
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release]')
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Read application version
        id: version
        run: |
          [xml]$project = Get-Content src/Planify.App/Planify.App.csproj -Raw
          $version = [string]$project.Project.PropertyGroup.Version
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid application version.' }
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Run regression checks
        run: dotnet run --project tests/Planify.Tests/Planify.Tests.csproj -c Release
      - name: Publish Windows x64
        run: dotnet publish src/Planify.App/Planify.App.csproj -c Release -r win-x64 --self-contained true -p:DebugType=None -p:DebugSymbols=false -o artifacts/publish
      - name: Include notices
        run: ./installer/Copy-Notices.ps1 -PublishDir artifacts/publish
      - name: Install WiX build tools
        run: |
          dotnet tool install --global wix --version 5.0.2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          wix extension add --global WixToolset.UI.wixext/5.0.2
      - name: Build MSI
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: ./installer/Build-Installer.ps1 -PublishDir artifacts/publish -OutputDir artifacts -Version $env:RELEASE_VERSION
      - name: Package portable application and checksums
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $version = $env:RELEASE_VERSION
          $msi = "artifacts/Planify-Windows-$version-x64.msi"
          $portable = "artifacts/Planify-Windows-$version-x64-portable.zip"
          Compress-Archive -Path artifacts/publish/* -DestinationPath $portable -CompressionLevel Optimal
          Get-FileHash $msi,$portable -Algorithm SHA256 | ForEach-Object {
            '{0}  {1}' -f $_.Hash.ToLowerInvariant(), [IO.Path]::GetFileName($_.Path)
          } | Set-Content artifacts/SHA256SUMS.txt -Encoding ascii
          $notes = @(
            ('# Planify Windows Community ' + $version),
            '',
            '## 更新内容',
            '- 支持添加、重命名和删除 Nextcloud 任务列表；删除前要求确认，并保护待同步修改。',
            '- 侧栏新增大号 + 按钮及右键管理菜单，支持拖拽排序，重新连接和同步后保留顺序。',
            '- 任务行可直接删除任务，删除前弹出确认对话框。',
            '- 修复添加任务列表时的 HTTP 400，并显示服务器返回的具体错误说明。',
            '',
            '## 下载与升级',
            ('- 安装版：Planify-Windows-' + $version + '-x64.msi。'),
            ('- 免安装版：Planify-Windows-' + $version + '-x64-portable.zip，解压整个目录后运行 Planify.App.exe。'),
            '- 支持 Windows 10 1809+ / Windows 11 x64，内含运行组件，无需另装 .NET。',
            '- 升级前请通过系统托盘菜单退出旧版；已有任务数据和已保存密码会继续使用。',
            '- 安装包未签名。SHA256SUMS.txt 提供两个下载文件的校验值。',
            '',
            '## 验证与说明',
            '- 本次发布流程运行回归测试、Windows x64 构建和 MSI 构建，全部成功后才发布。',
            '- 提醒时间通过 CalDAV 同步；当前尚无 Windows 后台弹窗提醒、自动后台同步或自动更新。',
            '- 基于 Planify 设计思路的独立社区实现，按 GPL-3.0-or-later 开源。',
            '',
            '## English',
            'This release adds Nextcloud task-list management, sidebar context menus and persistent drag ordering, confirmed task deletion, and a fix for the CalDAV MKCALENDAR request that caused HTTP 400. Download the Windows x64 MSI or extract the complete portable ZIP. Runtime components are included. Exit the previous app from its notification-area menu before upgrading. The installer is unsigned.',
            '',
            ('Source commit: ' + $env:GITHUB_SHA)
          )
          $notes | Set-Content artifacts/RELEASE-NOTES.md -Encoding utf8
      - name: Upload and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $version = $env:RELEASE_VERSION
          $tag = "v$version"
          $assets = @("artifacts/Planify-Windows-$version-x64.msi", "artifacts/Planify-Windows-$version-x64-portable.zip", 'artifacts/SHA256SUMS.txt')
          $existingJson = gh release view $tag --json isDraft,assets 2>$null
          $existing = if ($LASTEXITCODE -eq 0) { $existingJson | ConvertFrom-Json } else { $null }
          if ($existing -and !$existing.isDraft) { throw "Release $tag is already published; existing files will not be replaced." }
          if (!$existing) {
            gh release create $tag --draft --target $env:GITHUB_SHA --title "$tag - Nextcloud task-list management" --notes-file artifacts/RELEASE-NOTES.md
            if ($LASTEXITCODE -ne 0) { throw 'Could not create draft release.' }
          }
          $alreadyUploaded = @($existing.assets | ForEach-Object { $_.name })
          foreach ($asset in $assets) {
            if ([IO.Path]::GetFileName($asset) -in $alreadyUploaded) { throw 'Draft already contains assets; inspect it before retrying.' }
            gh release upload $tag $asset
            if ($LASTEXITCODE -ne 0) { throw "Could not upload $asset; release remains a draft." }
          }
          $uploadedJson = gh release view $tag --json assets
          if ($LASTEXITCODE -ne 0) { throw 'Could not verify uploaded assets.' }
          $uploaded = $uploadedJson | ConvertFrom-Json
          foreach ($asset in $assets) {
            $file = Get-Item -LiteralPath $asset
            $remote = @($uploaded.assets | Where-Object { $_.name -eq $file.Name })
            if ($remote.Count -ne 1 -or $remote[0].size -ne $file.Length) { throw "Upload verification failed for $asset." }
          }
          gh release edit $tag --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish release.' }
